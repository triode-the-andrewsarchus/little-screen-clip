# ==============================================================================
# Little Screen Clip Configuration
# ==============================================================================
# This configuration file controls display orientation, debug elements,
# and complete UI color theming for the ambient screen.
#
# Changes can be applied live without restarting the daemon:
#   ./launch.sh reload
# or:
#   ./target/debug/clipctl reload
# ==============================================================================

[display]
# Invert the screen 180 degrees (true for standard Trofeo Vision bottom-cable mounting).
# Set to false if mounted right-side up.
rotate_180 = true

# Toggle the debug handler badge in the bottom-left corner (e.g. "LH: [TEXT] | RH: [IMAGE]").
# Set to false to hide the badge and have a cleaner ambient display.
show_debug_handler = false

# Minimum interval between animation frame updates to the small USB display in milliseconds.
# The Trofeo embedded MCU hardware requires time to decompress each JPEG frame (~200-350ms).
# Sending frames faster than this upper limit can overwhelm the MCU and cause hardware watchdogs/resets.
# Recommended: 300 - 450 ms (default: 350ms = ~2.8 fps).
animation_interval_ms = 100

# Character used to indicate elision / truncated middle in long filenames (e.g. "▸", "…", "~")
elision_char = "▸"

# Color for the elision character.
# Set to "border" (default) to dynamically match each slot box's border color,
# or specify any hex color code (e.g. "#f59e0b", "#a855f7", "#38bdf8").
elision_color = "border"

[colors]
# Hundred Rabbits Theme name (from ./themes/*.svg, e.g. "apollo", "peppermint", "nord", "monokai", "dracula", etc.)
# All UI elements, cards, accents, borders, and harmonies automatically derive from this theme.
# Missing / accent colors are perceptually derived using Oklab harmonies (Complementary, Triadic, Tetradic, Split-Complementary).
theme = "zenburn"

# Optional element color overrides:
# Uncomment any field below to customize specific UI elements while retaining the theme base.
# background         = "#0f1117"
# hero_card_bg       = "#181b26"
# prior_card_bg      = "#13151d"
# undo_card_bg       = "#14161e"
# left_hand_border   = "#6366f1"
# right_hand_border  = "#10b981"
# undo_border        = "#f59e0b"
# cursor_border      = "#ec4899"
# selected_border    = "#8b5cf6"
# title_color        = "#f1f5f9"
# subtitle_color     = "#94a3b8"
# body_color         = "#cbd5e1"
# url_color          = "#38bdf8"
# debug_badge_bg     = "#0f172a"
# debug_badge_text   = "#38bdf8"

[slots]
# Number of prior history slots allocated to Left Hand (default: 3)
left_priors = 3
# Number of prior history slots allocated to Right Hand (default: 1)
right_priors = 1

[auto_actions]
# Automatically trim tracking query parameters (utm_*, fbclid, etc.) from copied URLs
trim_link_tracking = true

[audio]
# External editor escape hatch for audio (e.g. "audacity")
editor = "audacity"

# Maximum length (in seconds) of an audio file to render a full complete waveform (default: 300 = 5 minutes).
# Files longer than this threshold will display a high-resolution snippet preview instead of refusing.
max_full_waveform_sec = 300

# Length (in seconds) of the snippet to preview for long audio files (default: 30 seconds).
snippet_duration_sec = 30

# Where to sample the snippet from:
#   "middle" (default) -> Extracts a 30s representative sample from the middle of the audio file
#   "start"            -> Extracts a 30s sample from the very beginning (00:00) of the audio file
sample_position = "middle"
rolling_capture_duration_sec = 30
rolling_capture_enabled = true

[workbench]
# Preferred text editor command for editing Python and Bash script nodes
# (e.g. "code", "subl", "gedit", "kate", "nano", "nvim").
# If left commented or empty, automatically falls back to $VISUAL, $EDITOR, or system default "xdg-open".
# editor = "code"

[image]
# Preferred raster image editor for escape hatch (e.g. "krita", "gimp").
external_editor = "krita"

# Preferred vector / SVG editor for escape hatch (e.g. "inkscape").
svg_editor = "inkscape"

# Preferred lightweight image viewer (e.g. "nomacs", "eog", "feh", "xdg-open").
viewer = "nomacs"

# Background removal executable or script (e.g. "scripts/remove_bg.py" or custom command).
# If left empty, automatically checks for project script or system Python with nobg.
# bg_removal_cmd = "scripts/remove_bg.py"

# LaMa inpainting executable or script (e.g. "scripts/inpaint_lama.py" or custom command).
# If left empty, automatically checks for project script or system Python with onnxruntime.
# lama_inpaint_cmd = "scripts/inpaint_lama.py"

# Segment Anything executable or script (e.g. "scripts/segment_anything.py" or custom command).
# If left empty, automatically checks for project script or system Python with onnxruntime.
# sam_cmd = "scripts/segment_anything.py"

# Optional download URL overrides for image tools:
# lama_model_url = "https://huggingface.co/smile-forge/big-lama-onnx/resolve/main/big-lama.onnx"
# sam_encoder_model_url = "https://huggingface.co/Acly/MobileSAM/resolve/main/mobile_sam_image_encoder.onnx"
# sam_decoder_model_url = "https://huggingface.co/Acly/MobileSAM/resolve/main/sam_mask_decoder_single.onnx"

# [ai_models]
# Optional URL overrides for downloading ONNX neural network models.
# By default, public Hugging Face ONNX releases are downloaded into ~/.cache/little-screen-clip/models/.
# Override these to point to your own local/S3/mirror URLs to avoid dependency on 3rd-party availability:
# lama_url = "https://huggingface.co/smile-forge/big-lama-onnx/resolve/main/big-lama.onnx"
# feynobg_url = "https://huggingface.co/PinkPixel/fey-nobg-onnx/resolve/main/model_fp16.onnx"
# depth_url = "https://huggingface.co/mtbui2010/depth-anything-v2-small-ONNX/resolve/main/model.onnx"
# sam_encoder_url = "https://huggingface.co/Acly/MobileSAM/resolve/main/mobile_sam_image_encoder.onnx"
# sam_decoder_url = "https://huggingface.co/Acly/MobileSAM/resolve/main/sam_mask_decoder_single.onnx"
# siglip2_giant_url = "https://huggingface.co/onnx-community/siglip2-giant-opt-patch16-256-ONNX/resolve/main/onnx/vision_model_quantized.onnx"
# siglip2_giant_text_url = "https://huggingface.co/onnx-community/siglip2-giant-opt-patch16-256-ONNX/resolve/main/onnx/text_model_quantized.onnx"
# siglip2_giant_tokenizer_url = "https://huggingface.co/onnx-community/siglip2-giant-opt-patch16-256-ONNX/resolve/main/tokenizer.json"

[text]
# Preferred external text editor command for text preview escape hatch
# (e.g. "code", "subl", "gedit", "kate", "nano", "nvim").
# Defaults to "code".
editor = "code"

[model3d]
# Maximum triangle count for the rotating preview thumbnail on the display and workbench mirror.
# Higher values (e.g. 15,000 - 30,000) provide finer geometric detail and smoother curves.
# Lower values (e.g. 2,000 - 5,000) reduce CPU usage on weaker CPUs (e.g. Raspberry Pi / low-power laptops).
# Default: 10000
preview_triangle_limit = 10000

# Maximum triangle count rendered in the interactive 3D workbench studio viewer.
# Default: 150000
workbench_triangle_limit = 150000

[file_manager]
# Drum-pad rows, bottom to top. Logical characters respect hardware remapping.
constellation_pad_keys = ["zxcv", "asdf", "qwer", "1234"]
# Pixels per video timeline sample: 1 (native resolution), 2, 4, 8, or 16.
video_timeline_decimation = 1
photo_mode = "similarity"
photo_recurse = true
