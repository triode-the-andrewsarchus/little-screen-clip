[dependencies.brotli-decompressor]
version = "5.0.3"

[dependencies.d2-rs-core]
version = "0.1.7"

[dependencies.d2-rs-fontface]
version = "0.1.7"

[dependencies.d2-rs-language]
version = "0.1.7"

[dependencies.d2-rs-math]
version = "0.1.7"

[dependencies.d2-rs-render]
version = "0.1.7"

[dependencies.d2-rs-scene]
version = "0.1.7"

[dependencies.d2-rs-sketch]
version = "0.1.7"

[dependencies.d2-rs-target]
version = "0.1.7"

[dependencies.d2-rs-text]
version = "0.1.7"

[dependencies.roxmltree]
version = "0.21.1"
features = ["positions"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
