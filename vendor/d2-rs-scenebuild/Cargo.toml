    "preserve_order",
    "float_roundtrip",
    "raw_value",
]

[dependencies.sha2]
version = "0.10"

[dependencies.url]
version = "2.5"

[dev-dependencies.d2-rs-raster]
version = "0.1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.12.28"
