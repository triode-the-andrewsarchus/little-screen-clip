[package]
edition = "2021"
name = "tikra"
version = "1.9.2"
build = false
include = [
    "src/**",
    "Cargo.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TikZ figures to SVG and PNG with no TeX install; math labels by mathra."
homepage = "https://github.com/matheusmota-dev-br/tikra"
readme = "README.md"
keywords = [
    "tikz",
    "pgfplots",
    "svg",
    "png",
    "latex",
]
categories = [
    "rendering",
    "graphics",
    "text-processing",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusmota-dev-br/tikra"

[features]
default = ["raster"]
raster = ["dep:resvg"]
motion = ["dep:png", "raster"]

[lib]
name = "tikra"
path = "src/lib.rs"

[dependencies.mathra]
version = "=1.12.0"
default-features = false
features = ["latin-modern"]

[dependencies.png]
version = "0.17"
optional = true

[dependencies.resvg]
version = "0.45"
optional = true
features = ["raster-images"]
default-features = false

[dependencies.serde_json]
version = "1"

[dependencies.ttf-parser]
version = "0.25"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(coverage)"]
