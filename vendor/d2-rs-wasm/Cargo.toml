[package]
edition = "2024"
rust-version = "1.98.1"
name = "d2-rs-wasm"
version = "0.1.7"
authors = ["Nelson Chen"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "WebAssembly bindings for d2-rs, a Rust port of D2's d2js package."
homepage = "https://github.com/nelsonjchen/d2-rs"
readme = "README.md"
keywords = [
    "d2",
    "diagram",
    "diagrams-as-code",
    "svg",
    "graph-layout",
]
categories = [
    "wasm",
    "visualization",
    "graphics",
]
license = "MPL-2.0"
repository = "https://github.com/nelsonjchen/d2-rs"
resolver = "2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[features]
oracle-fixtures = []

[lib]
name = "d2_rs_wasm"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[example]]
name = "svg-scoreboard"
path = "examples/svg-scoreboard.rs"

[[example]]
name = "wasm-admission-scoreboard"
path = "examples/wasm-admission-scoreboard.rs"

[[example]]
name = "wasm-isometric-scoreboard"
path = "examples/wasm-isometric-scoreboard.rs"

