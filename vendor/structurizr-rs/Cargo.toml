[workspace]
resolver = "2"
members = ["crates/structurizr-core", "crates/structurizr-dsl", "crates/structurizr-render"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pretty_assertions = "1"
structurizr-core = { path = "crates/structurizr-core" }
