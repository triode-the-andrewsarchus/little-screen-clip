[package]
name = "clip-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
little-clip-core = { path = "../little-clip-core" }
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tiny-skia.workspace = true
toml.workspace = true
serde_yaml.workspace = true
image.workspace = true
resvg = { version = "0.37", default-features = false, features = ["text", "raster-images"] }
regex.workspace = true
uuid.workspace = true
base64 = "0.22"
libc = "0.2"
chrono = "0.4"

tempfile = "3.27"
sha2 = "0.10"
half = "2"
rusqlite = { version = "0.35", features = ["bundled", "backup", "limits", "hooks", "functions", "serialize"] }

[dev-dependencies]
little-clip-core = { path = "../little-clip-core", features = ["test-support"] }
