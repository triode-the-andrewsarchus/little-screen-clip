[package]
name = "clip-file-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
clip-search = { path = "../clip-search" }
clip-studios = { path = "../clip-studios" }
clip-ui = { path = "../clip-ui" }
little-clip-core = { path = "../little-clip-core" }
little-clip-render = { path = "../little-clip-render" }
little-clip-scene = { path = "../little-clip-scene" }
little-clip-ops = { path = "../little-clip-ops" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.27"
egui-winit = { version = "0.27", default-features = false, features = ["wayland"] }
egui_extras = { version = "0.27", features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
base64 = "0.22"
uuid = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rodio = { version = "0.22.2", features = ["symphonia-mp2", "symphonia-caf", "symphonia-mkv", "symphonia-aiff"] }
hound = "3.5.1"
image = { workspace = true }
zip = { version = "7.4", default-features = false, features = ["deflate"] }
imagesize = "0.12"
tiny-skia = { workspace = true }
ttf-parser = "0.25"
wuff = "0.2.10"
udev = "0.9.3"
syntect = { workspace = true }
unicode-width = "0.2.3"
regex = { workspace = true }
tempfile = "3.27"
libc = "0.2"
chrono = "0.4"
trash = "5.3.0"
url.workspace = true
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }

object = { version = "0.40", default-features = false, features = ["read", "std"] }
sha2 = "0.10"
ort = { version = "2.0.0-rc.15", features = ["download-binaries", "cuda"] }
ndarray = "0.17.2"
fuse-binwalk = { git = "https://github.com/triode-the-andrewsarchus/fuse-binwalk" }
rusqlite = { version = "0.35", features = ["bundled", "backup", "limits", "hooks", "functions", "serialize"] }
realfft = "3.5.1"
midir = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
clip-search = { path = "../clip-search", features = ["test-support"] }
clip-studios = { path = "../clip-studios", features = ["test-support"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
raw-cpuid = "11.6.0"
