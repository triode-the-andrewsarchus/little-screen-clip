[package]
name = "little-clipd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
little-clip-core = { path = "../little-clip-core" }
little-clip-driver = { path = "../little-clip-driver" }
little-clip-render = { path = "../little-clip-render" }
little-clip-ops = { path = "../little-clip-ops" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true }
thiserror.workspace = true
uuid.workspace = true
zbus = "5.19.0"
futures-util = "0.3.34"
tempfile = "3.10"
libc = "0.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
tokio = { workspace = true, features = ["test-util"] }
