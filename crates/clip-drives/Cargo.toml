[package]
name = "clip-drives"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
test-support = []

[[example]]
name = "drive_fixture"
required-features = ["test-support"]

[dependencies]
little-clip-core = { path = "../little-clip-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rustix = { workspace = true, features = ["system"] }
tracing.workspace = true
libc = "0.2"
tempfile = "3.27"
rusqlite = { version = "0.35", features = ["bundled", "hooks"] }
sha2 = "0.10"
fuser = { version = "0.18", default-features = false }
zbus = { version = "5.19.0", features = ["blocking-api"] }

[dev-dependencies]
tokio.workspace = true
