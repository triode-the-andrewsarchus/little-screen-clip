[package]
name = "little-clip-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
little-clip-core = { path = "../little-clip-core" }
little-clip-scene = { path = "../little-clip-scene" }
tiny-skia.workspace = true
resvg = { version = "0.37", default-features = false, features = ["text", "raster-images"] }
fontdue.workspace = true
ttf-parser = "0.25"
image.workspace = true
thiserror.workspace = true
tracing.workspace = true
syntect.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.20"
pikchr-rs = "=0.1.0"
svgbob = "0.7.6"
merman = { version = "=0.10.0", features = ["system-clock", "system-timezone"] }
lini = "=1.1.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
mathra = { version = "=1.12.0", default-features = false }
graphviz-pure = "=1.2.0"
graphviz-pure-core = "=1.2.0"
graphviz-pure-parser = "=1.2.0"

d2-rs-wasm = "=0.1.7"
d2-rs-render = "=0.1.7"
d2-rs-target = "=0.1.7"
d2-rs-scenebuild = "=0.1.7"
d2-rs-raster = "=0.1.7"

bpmnkit-bpmn = "=0.2.1"
bpmnkit-render = { version = "=0.2.1", default-features = false }
bpmnkit-layout = "=0.2.1"
bpmnkit-spec = "=0.2.1"

rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

excalidraw-render = { version = "=0.1.0", default-features = false, features = ["cjk"] }
excalidraw-render-fonts = { version = "=0.1.0", default-features = false, features = ["cjk"] }
wuff = "0.2.10"
base64 = "0.22"
data-url = "0.3"

[dev-dependencies]
tempfile = "3.27"
