[package]
name = "little-clip-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
little-clip-core = { path = "../little-clip-core" }
little-clip-scene = { path = "../little-clip-scene" }
tiny-skia.workspace = true
resvg = { version = "0.37", default-features = false, features = ["text"] }
fontdue.workspace = true
ttf-parser = "0.25"
image.workspace = true
thiserror.workspace = true
tracing.workspace = true
syntect.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.20"
pikchr-rs = "=0.1.0"
svgbob = "0.7.6"
merman = { version = "=0.10.0", features = ["system-clock", "system-timezone"] }
lini = "=1.1.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
mathra = { version = "=1.12.0", default-features = false }
graphviz-pure = "=1.2.0"
graphviz-pure-core = "=1.2.0"
graphviz-pure-parser = "=1.2.0"

[dev-dependencies]
tempfile = "3.27"
