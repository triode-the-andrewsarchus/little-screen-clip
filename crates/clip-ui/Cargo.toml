[package]
name = "clip-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
little-clip-core = { path = "../little-clip-core" }
egui = "0.27"
egui_extras = { version = "0.27", features = ["svg"] }
tracing.workspace = true
egui_glow = "0.27"
femtovg = { version = "=0.28.0", default-features = false }
usvg = { version = "0.49", default-features = false }
image.workspace = true

[dev-dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland"] }
