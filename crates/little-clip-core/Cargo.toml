[package]
name = "little-clip-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
rustix.workspace = true
clip-media-protocol = { path = "../clip-media-protocol" }
libc = "0.2"
imagesize = "0.12"
kamadak-exif = "0.6.2"
serde.workspace = true
serde_json.workspace = true
json5 = "1.3.7"
