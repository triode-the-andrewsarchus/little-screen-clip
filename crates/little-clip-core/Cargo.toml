merman-core = { version = "=0.10.0", default-features = false, features = ["diagram-flowchart", "editor-facts"] }
merman-model = { version = "=0.10.0", default-features = false, features = ["diagram-flowchart"] }
oneyaml = "=1.2.0"
excalidraw-document = "=0.2.0"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
tracing.workspace = true
sha2 = "0.10"
mime_guess = "2.0"
image.workspace = true
percent-encoding.workspace = true
toml.workspace = true
toml_edit = "0.22"
symphonia.workspace = true
hound = "3.5.1"
rustchord = "0.6.0"
realfft = "3.5.1"
rayon.workspace = true
fearless_simd = "1.2"
fearless_simd_macros = "0.1"
lopdf = "0.38"
chrono = "0.4"
calamine = "0.36.1"
midly = "0.5"
scenix-loader = "1.10.0"
gltf = "1.4"
scenix-mesh = "1.10.0"
ufbx = "0.11.5"
tobj = "4.0"
tempfile = "3.27"
regex.workspace = true
flate2 = "1.1"
zstd = { version = "0.13", default-features = false }
quick-xml = "0.41"
roxmltree = "0.20"
ncw = "=0.4.0"
scraper = { version = "0.27", default-features = false }
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
ical = { version = "0.11", default-features = false, features = ["ical"] }
wait-timeout = "0.2"
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17", "image"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image", "lcms2"] }
