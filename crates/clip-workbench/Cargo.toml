[package]
name = "clip-workbench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "clip-workbench"

[[bin]]
name = "clip-file-manager"
path = "src/bin/clip-file-manager.rs"

[dependencies]
little-clip-core = { path = "../little-clip-core" }
little-clip-render = { path = "../little-clip-render" }
little-clip-scene = { path = "../little-clip-scene" }
little-clip-ops = { path = "../little-clip-ops" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.27"
egui-winit = { version = "0.27", default-features = false, features = ["wayland"] }
egui_extras = { version = "0.27", features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
thiserror.workspace = true
tracing.workspace = true
rodio = "0.22.2"
image = { workspace = true }
imagesize = "0.12"
kamadak-exif = "0.6.1"
png = "0.18.1"
tiny-skia = { workspace = true }
fontdue = { workspace = true }
ttf-parser = "0.25"
wuff = "0.2.9"
udev = "0.9.3"
syntect = { workspace = true }
unicode-width = "0.2.2"
regex = { workspace = true }
webp = "0.3.1"
libwebp-sys = "0.9.6"
tempfile = "3.10"
libc = "0.2"
chrono = "0.4"
trash = "5.2.9"
url.workspace = true
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
filmr = { path = "../../vendor/filmr", default-features = false, features = ["compute-gpu"] }

object = { version = "0.40", default-features = false, features = ["read", "std"] }
sha2 = "0.10"
ort = { version = "2.0.0-rc.15", features = ["download-binaries"] }
ndarray = "0.17.2"
fuse-binwalk = { git = "https://github.com/triode-the-andrewsarchus/fuse-binwalk" }

[dev-dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["client_support", "serde", "encoding_rs", "encoders", "decoders", "full_barcode_format_support", "multi_barcode_readers"] }
filmr-pinned = { package = "filmr", git = "https://github.com/W-Mai/filmr", rev = "fee388e213dd77bfe6977b63071b1c136213373a", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
raw-cpuid = "11.6.0"
