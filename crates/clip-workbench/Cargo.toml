[package]
name = "clip-workbench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "clip-workbench"

[[bin]]
name = "clip-file-manager"
path = "src/bin/clip-file-manager.rs"

[dependencies]
little-clip-core = { path = "../little-clip-core" }
little-clip-render = { path = "../little-clip-render" }
little-clip-scene = { path = "../little-clip-scene" }
little-clip-ops = { path = "../little-clip-ops" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
thiserror.workspace = true
tracing.workspace = true
rodio = "0.22.2"
image = { workspace = true }
png = "0.18.1"
tiny-skia = { workspace = true }
fontdue = { workspace = true }
syntect = { workspace = true }
regex = { workspace = true }
webp = "0.3.1"
libwebp-sys = "0.9.6"
tempfile = "3.10"
libc = "0.2"
chrono = "0.4"
filmr = { path = "../../vendor/filmr", default-features = false, features = ["compute-gpu"] }

[dev-dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["client_support", "serde", "encoding_rs", "encoders", "decoders", "full_barcode_format_support", "multi_barcode_readers"] }
filmr-pinned = { package = "filmr", git = "https://github.com/W-Mai/filmr", rev = "fee388e213dd77bfe6977b63071b1c136213373a", default-features = false }
