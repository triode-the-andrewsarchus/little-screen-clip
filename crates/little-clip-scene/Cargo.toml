[package]
name = "little-clip-scene"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
thiserror.workspace = true
wgpu = "28.0"
wgpu-3dgs-viewer = "=0.6.0"
pollster = "0.4"
ply-rs = "0.1.3"
flate2 = "1.0"
zstd = "0.13"
spark-lib = { git = "https://github.com/sparkjsdev/spark", rev = "f5368253780bed4d863c96b1fdea9dd3d614d131", default-features = false, features = ["gsplat", "sogs", "ply"] }
serde_json.workspace = true
zip = { version = "7.0", default-features = false, features = ["deflate"] }

oxideav-gltf = { version = "=0.0.4", default-features = false }
nalgebra = { version = "0.32", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.10"
