[workspace]
exclude = ["vendor/excalidraw-render", "vendor/spark/rust", "vendor/dbml-rs", "vendor/plantuml-core", "vendor/document-svg-drawio", "vendor/structurizr-rs", "vendor/tikra", "vendor/minedmap", "vendor/remarkable-rm"]
resolver = "2"
members = [
    "crates/little-clip-core",
    "crates/little-clip-driver",
    "crates/little-clip-render",
    "crates/little-clip-scene",
    "crates/little-clip-ops",
    "crates/little-clipd",
    "crates/clip-workbench",
    "crates/clip-ui",
    "crates/clip-studios",
    "crates/clip-search",
    "crates/clip-file-manager",
    "crates/clipctl",
    "crates/little-clip-nki",
    "crates/clip-media-worker",
    "crates/clip-media-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vega"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "system_fonts", "wayland"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui_extras = { version = "0.37", features = ["svg"] }
egui_glow = "0.37"
egui_kittest = "0.37"
egui-winit = { version = "0.37", default-features = false }
rustix = { version = "1.1.6", features = ["fs", "event", "process", "thread", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
rusb = "0.9"
image = { version = "0.25", default-features = false, features = ["default-formats", "rayon"] }
tiny-skia = "0.12"
resvg = { version = "0.50", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "0.50", default-features = false }
roxmltree = "0.21"
base64 = "0.23"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
zstd = { version = "0.14", default-features = false }
fontdue = "0.9"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
percent-encoding = "2.3"
toml = "1.2"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp2", "mp3", "wav", "flac", "ogg", "vorbis", "isomp4", "alac", "aac", "pcm", "caf", "mkv", "aiff", "opus"] }
serde-saphyr = { version = "2.2", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rayon = "1.12"
regex = "1.13"
flashraw = { version = "0.3.1", default-features = false, features = ["rayon", "simd"] }


# Keep local builds bounded: this workspace's incremental cache can exceed the
# compiled artifacts many times over. Line tables retain useful backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3

# DSP, image and terrain loops live in this workspace crate, so the dependency
# wildcard above does not optimize them. Keep desktop previews responsive in
# development builds too; line tables and debug assertions remain enabled.
[profile.dev.package.little-clip-core]
opt-level = 3

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
plantuml-core = { path = "vendor/plantuml-core" }
dbml-rs = { path = "vendor/dbml-rs" }
excalidraw-render = { path = "vendor/excalidraw-render" }
sauron-core = { path = "vendor/sauron-core" }
symphonia = { path = "vendor/symphonia" }
symphonia-adapter-libopus = { path = "vendor/symphonia-adapter-libopus" }
symphonia-format-caf = { path = "vendor/symphonia-format-caf" }
remarkable-rm = { path = "vendor/remarkable-rm" }
symphonia-codec-pcm = { path = "vendor/symphonia-codec-pcm" }

d2-rs-wasm = { path = "vendor/d2-rs-wasm" }
d2-rs-scenebuild = { path = "vendor/d2-rs-scenebuild" }

[patch."https://github.com/sparkjsdev/spark"]
spark-lib = { path = "vendor/spark/rust/spark-lib" }
