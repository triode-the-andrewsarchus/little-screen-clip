[workspace]
exclude = ["vendor/excalidraw-render", "vendor/spark/rust", "vendor/dbml-rs", "vendor/plantuml-core", "vendor/document-svg-drawio", "vendor/structurizr-rs", "vendor/tikra"]
resolver = "2"
members = [
    "crates/little-clip-core",
    "crates/little-clip-driver",
    "crates/little-clip-render",
    "crates/little-clip-scene",
    "crates/little-clip-ops",
    "crates/little-clipd",
    "crates/clip-workbench",
    "crates/clip-ui",
    "crates/clip-studios",
    "crates/clip-search",
    "crates/clip-file-manager",
    "crates/clipctl",
    "crates/little-clip-nki",
    "crates/clip-media-worker",
    "crates/clip-media-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vega"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustix = { version = "1.1.6", features = ["fs", "event", "process", "thread", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
tokio = { version = "1.54", features = ["full"] }
rusb = "0.9"
image = { version = "0.25", default-features = false, features = ["default-formats", "rayon"] }
tiny-skia = "0.11"
fontdue = "0.9"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
percent-encoding = "2.3"
toml = "0.8"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp2", "mp3", "wav", "flac", "ogg", "vorbis", "isomp4", "alac", "aac", "pcm", "caf", "mkv", "aiff", "opus"] }
serde_yaml = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rayon = "1.12"
regex = "1.13"


# Keep local builds bounded: this workspace's incremental cache can exceed the
# compiled artifacts many times over. Line tables retain useful backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3

# egui 0.27 requests physical startup dimensions before Wayland knows output scale.
[patch.crates-io]
plantuml-core = { path = "vendor/plantuml-core" }
dbml-rs = { path = "vendor/dbml-rs" }
excalidraw-render = { path = "vendor/excalidraw-render" }
sauron-core = { path = "vendor/sauron-core" }
symphonia = { path = "vendor/symphonia" }
symphonia-adapter-libopus = { path = "vendor/symphonia-adapter-libopus" }
egui-winit = { path = "vendor/egui-winit" }
symphonia-format-caf = { path = "vendor/symphonia-format-caf" }
symphonia-codec-pcm = { path = "vendor/symphonia-codec-pcm" }

d2-rs-wasm = { path = "vendor/d2-rs-wasm" }
d2-rs-scenebuild = { path = "vendor/d2-rs-scenebuild" }

[patch."https://github.com/sparkjsdev/spark"]
spark-lib = { path = "vendor/spark/rust/spark-lib" }
